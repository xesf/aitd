name: Build

# Builds every platform on each push and pull request. A tag vX.Y.Z also
# publishes a release with the packages and the changelog's section for
# that version. The tag must match the VERSION file.

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apple:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - run: platforms/dist.sh macos ios
      - uses: actions/upload-artifact@v4
        with: { name: apple, path: dist/*.zip }

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libx11-dev libasound2-dev gcc-mingw-w64-x86-64 zip
      - run: platforms/dist.sh linux windows
      - uses: actions/upload-artifact@v4
        with: { name: linux-windows, path: dist/*.zip }

  watcom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: open-watcom/setup-watcom@v0
        with: { version: "2.0" }
      - run: platforms/dist.sh dos win9x
      - uses: actions/upload-artifact@v4
        with: { name: dos-win9x, path: dist/*.zip }

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: mymindstorm/setup-emsdk@v14
        with: { version: "3.1.53" }
      - run: platforms/dist.sh web
      - uses: actions/upload-artifact@v4
        with: { name: web, path: dist/*.zip }

  psp:
    runs-on: ubuntu-latest
    container: pspdev/pspdev:latest
    steps:
      - run: apk add --no-cache make zip git
      - uses: actions/checkout@v4
      - run: platforms/dist.sh psp
      - uses: actions/upload-artifact@v4
        with: { name: psp, path: dist/*.zip }

  vita:
    runs-on: ubuntu-latest
    container: vitasdk/vitasdk:latest
    steps:
      - run: apk add --no-cache make cmake zip git || (apt-get update && apt-get install -y make cmake zip git)
      - uses: actions/checkout@v4
      - run: VITASDK=/usr/local/vitasdk platforms/dist.sh vita
      - uses: actions/upload-artifact@v4
        with: { name: vita, path: dist/*.zip }

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [apple, linux, watcom, web, psp, vita]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag against VERSION
        run: test "${GITHUB_REF_NAME#v}" = "$(cat VERSION)"
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Release notes from CHANGELOG.md
        run: |
          awk -v v="$(cat VERSION)" '
            $0 ~ "^## \\[" v "\\]" { on = 1; next }
            on && /^## \[/ { exit }
            on { print }' CHANGELOG.md > notes.md
      - run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --notes-file notes.md
        env:
          GH_TOKEN: ${{ github.token }}
